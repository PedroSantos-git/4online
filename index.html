<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Projects</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <header>
        <div class="site-info">
            <h1 class="signature">Pedro Santos</h1>
            <p>My Projects — welcome to my portfolio!</p>
        </div>
        <div class="auth-area">
            <span id="signedInAs"></span>
            <div id="g_id_signin"></div>
            <button id="reorderBtn" class="glass-btn" type="button" style="display:none">Reorder</button>
            <button id="signOutBtn" class="glass-btn" type="button" style="display:none">Sign out</button>
        </div>
    </header>

    <main>
        <section class="add-card" id="addCard" style="display:none">
            <h2>Add New Project</h2>
            <form id="projectForm">
                <input type="text" id="projectName" placeholder="Project Name" required>
                <input type="url" id="projectUrl" placeholder="Project URL" required>
                <button type="submit" class="glass-btn">Add Project</button>
            </form>
        </section>

        <section class="projects">
            <div id="projectsContainer" class="cards-container"></div>
        </section>
    </main>

    <dialog id="reorderDialog" class="reorder-dialog" aria-labelledby="reorderTitle">
        <div class="reorder-head">
            <h2 id="reorderTitle">Reorder projects</h2>
            <p>Drag the rows or use the arrows. The first one shows first on the site.</p>
        </div>
        <ol id="reorderList" class="reorder-list"></ol>
        <div class="reorder-actions">
            <button type="button" class="glass-btn card-btn" id="reorderCancel">Cancel</button>
            <button type="button" class="glass-btn card-btn primary" id="reorderSave">Save order</button>
        </div>
    </dialog>

    <footer>
        <p>&copy; 2026 Pedro Santos. All rights reserved.</p>
        <p class="footer-uuid">Machine UUID: <span id="uuid"></span></p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
